<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Solutions — Chamados</title>
  <style>
    body {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    h1, h2 {
      color: #1d4ed8;
    }

    form, article, .indicadores {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .indicadores p {
      margin: 0;
    }

    label, input, textarea, select, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    input, textarea, select {
      padding: 10px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
    }

    button {
      width: auto;
      padding: 10px 16px;
      background: #1d4ed8;
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .acoes {
      display: flex;
      gap: 12px;
      align-items: end;
    }

    .acoes label {
      margin-bottom: 0;
    }

    .erro {
      color: #b91c1c;
      font-weight: bold;
    }

    .sucesso {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Sistema de Chamados</h1>
  <p>Nexa Solutions — abertura e acompanhamento de chamados internos.</p>

  <section>
    <h2>Indicadores</h2>
    <div id="indicadores" class="indicadores">
      <p>Carregando...</p>
    </div>
  </section>

  <section>
    <h2>Abrir chamado</h2>

    <form id="form-chamado">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" type="text">

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao"></textarea>

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="ABERTO">Aberto</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDO">Concluído</option>
      </select>

      <button type="submit">Cadastrar chamado</button>
    </form>

    <p id="mensagem"></p>
  </section>

  <section>
    <h2>Chamados cadastrados</h2>
    <div class="acoes">
      <label for="filtro-status">
        Filtrar por status
        <select id="filtro-status">
          <option value="">Todos</option>
          <option value="ABERTO">Aberto</option>
          <option value="EM_ANDAMENTO">Em andamento</option>
          <option value="CONCLUIDO">Concluído</option>
        </select>
      </label>
      <button id="atualizar" type="button">Atualizar lista</button>
    </div>
    <div id="lista-chamados"></div>
  </section>

  <script>
    const API_CHAMADOS = "/api/chamados/";
    const API_INDICADORES = "/api/indicadores/";

    function mensagemDeErro(corpo) {
      if (corpo && corpo.titulo) {
        return Array.isArray(corpo.titulo) ? corpo.titulo.join(" ") : String(corpo.titulo);
      }
      if (corpo && corpo.status) {
        return Array.isArray(corpo.status) ? corpo.status.join(" ") : String(corpo.status);
      }
      return "Erro ao cadastrar chamado.";
    }

    async function carregarIndicadores() {
      const painel = document.getElementById("indicadores");
      try {
        const resposta = await fetch(API_INDICADORES);
        const dados = await resposta.json();
        painel.innerHTML = `
          <p><strong>Total:</strong> ${dados.total}</p>
          <p><strong>Abertos:</strong> ${dados.abertos}</p>
          <p><strong>Em andamento:</strong> ${dados.em_andamento}</p>
          <p><strong>Concluídos:</strong> ${dados.concluidos}</p>
        `;
      } catch (erro) {
        painel.innerHTML = "<p class='erro'>Não foi possível carregar os indicadores.</p>";
      }
    }

    async function listarChamados() {
      const lista = document.getElementById("lista-chamados");
      const filtro = document.getElementById("filtro-status").value;
      lista.innerHTML = "<p>Carregando...</p>";

      const url = filtro ? `${API_CHAMADOS}?status=${encodeURIComponent(filtro)}` : API_CHAMADOS;

      try {
        const resposta = await fetch(url);
        const chamados = await resposta.json();

        if (!resposta.ok) {
          lista.innerHTML = `<p class='erro'>${mensagemDeErro(chamados)}</p>`;
          return;
        }

        if (chamados.length === 0) {
          lista.innerHTML = "<p>Nenhum chamado cadastrado.</p>";
          return;
        }

        lista.innerHTML = chamados.map((chamado) => `
          <article>
            <strong>#${chamado.id} — ${chamado.titulo}</strong>
            <p>${chamado.descricao || "Sem descrição"}</p>
            <p>Status: ${chamado.status}</p>
          </article>
        `).join("");
      } catch (erro) {
        lista.innerHTML = "<p class='erro'>Não foi possível consultar a API.</p>";
      }
    }

    document.getElementById("form-chamado").addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const mensagem = document.getElementById("mensagem");
      const dados = {
        titulo: document.getElementById("titulo").value,
        descricao: document.getElementById("descricao").value,
        status: document.getElementById("status").value
      };

      try {
        const resposta = await fetch(API_CHAMADOS, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });
        const corpo = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
          mensagem.className = "erro";
          mensagem.textContent = mensagemDeErro(corpo);
          return;
        }

        mensagem.className = "sucesso";
        mensagem.textContent = "Chamado cadastrado com sucesso.";
        document.getElementById("form-chamado").reset();
        listarChamados();
        carregarIndicadores();
      } catch (erro) {
        mensagem.className = "erro";
        mensagem.textContent = "A API não está disponível.";
      }
    });

    document.getElementById("atualizar").addEventListener("click", () => {
      listarChamados();
      carregarIndicadores();
    });

    document.getElementById("filtro-status").addEventListener("change", listarChamados);

    listarChamados();
    carregarIndicadores();
  </script>
</body>
</html>
