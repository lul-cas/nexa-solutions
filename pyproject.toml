[tool.ruff]
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/.venv", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "S"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings.py" = ["S105"]
"backend/entrypoint.py" = ["S606"]
"backend/chamados/tests.py" = ["S101"]
